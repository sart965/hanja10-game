<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4급시험 훈음테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#eef6ff,#fff7ed);color:#24324a;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.09)}
h1{text-align:center;margin:4px 0 8px;font-size:32px}.sub{text-align:center;color:#64748b;margin-bottom:22px}.name{width:100%;padding:15px;border:2px solid #dbe4f0;border-radius:14px;font-size:18px;margin-bottom:16px}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.modes button,.btn{border:0;border-radius:12px;padding:13px 6px;font-size:16px;font-weight:700;cursor:pointer;background:#e8f0ff;color:#294b85}.modes button:hover,.btn:hover{transform:translateY(-1px)}
.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#64748b;font-weight:700}
.hanja{text-align:center;font-size:88px;font-weight:800;margin:20px 0 25px;line-height:1.1}.input{width:100%;padding:17px;border:2px solid #dbe4f0;border-radius:14px;font-size:20px;text-align:center}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.btn.primary{background:#4f7cff;color:white}.btn.answer{background:#fff0d8;color:#9a5b00}.feedback{text-align:center;min-height:32px;margin:14px 0;font-weight:800}.result{text-align:center}.score{font-size:46px;font-weight:900;margin:8px}.wrong{margin-top:20px;text-align:left;background:#f8fafc;border-radius:16px;padding:16px;max-height:280px;overflow:auto}.wrong div{padding:8px 0;border-bottom:1px solid #e5e7eb}.retry{margin-top:14px;width:100%}
@media(max-width:560px){h1{font-size:27px}.modes{grid-template-columns:repeat(3,1fr)}.hanja{font-size:72px}}
</style></head><body><div class="wrap"><div class="card">
<section id="start"><h1>📚 4급시험 훈음테스트</h1><div class="sub">4급 배정한자 기준 · 총 250자</div>
<input id="name" class="name" placeholder="학생 이름을 입력하세요">
<div class="modes">
<button onclick="start(50)">50문제</button><button onclick="start(100)">100문제</button><button onclick="start(150)">150문제</button><button onclick="start(200)">200문제</button><button onclick="start(250)">250문제</button>
</div></section>
<section id="quiz" class="hidden"><div class="top"><span id="progress"></span><span id="score"></span></div>
<div id="hanja" class="hanja"></div><input id="answer" class="input" placeholder="훈음(뜻과 음)을 입력하세요" autocomplete="off">
<div class="actions"><button class="btn primary" onclick="check()">정답 확인</button><button class="btn answer" onclick="showAnswer()">정답 보기</button></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="hidden result"><h1>🎉 테스트 완료!</h1><div id="resultName"></div><div class="score" id="finalScore"></div><div id="percent"></div><div id="wrong" class="wrong"></div><button id="retry" class="btn primary retry" onclick="retryWrong()">🔄 틀린 문제 다시 풀기</button></section>
</div></div>

,{"hanja":"豫","meaning":"미리 예"},{"hanja":"遇","meaning":"만날 우"},{"hanja":"郵","meaning":"우편 우"},{"hanja":"優","meaning":"넉넉할 / 뛰어날 우"},{"hanja":"怨","meaning":"원망할 원"},{"hanja":"源","meaning":"근원 원"},{"hanja":"援","meaning":"도울 원"},{"hanja":"危","meaning":"위태할 위"},{"hanja":"委","meaning":"맡길 위"},{"hanja":"威","meaning":"위엄 위"},{"hanja":"圍","meaning":"에워쌀 위"},{"hanja":"慰","meaning":"위로할 위"},{"hanja":"乳","meaning":"젖 유"},{"hanja":"遊","meaning":"놀 유"},{"hanja":"遺","meaning":"남길 / 잃을 유"},{"hanja":"儒","meaning":"선비 유"},{"hanja":"隱","meaning":"숨을 은"},{"hanja":"依","meaning":"의지할 의"},{"hanja":"儀","meaning":"거동 의"},{"hanja":"疑","meaning":"의심할 의"},{"hanja":"異","meaning":"다를 이"},{"hanja":"仁","meaning":"어질 인"},{"hanja":"姉","meaning":"손윗누이 자"},{"hanja":"姿","meaning":"모양 자"},{"hanja":"資","meaning":"재물 자"},{"hanja":"殘","meaning":"잔인할 / 남을 잔"},{"hanja":"雜","meaning":"섞일 잡"},{"hanja":"壯","meaning":"씩씩할 장"},{"hanja":"裝","meaning":"꾸밀 장"},{"hanja":"奬","meaning":"장려할 장"},{"hanja":"帳","meaning":"장막 장"},{"hanja":"張","meaning":"베풀 장"},{"hanja":"腸","meaning":"창자 장"},{"hanja":"底","meaning":"밑 저"},{"hanja":"賊","meaning":"도둑 적"},{"hanja":"適","meaning":"맞을 적"},{"hanja":"積","meaning":"쌓을 적"},{"hanja":"績","meaning":"길쌈 적"},{"hanja":"籍","meaning":"문서 적"},{"hanja":"專","meaning":"오로지 전"},{"hanja":"轉","meaning":"구를 전"},{"hanja":"錢","meaning":"돈 전"},{"hanja":"折","meaning":"꺾을 절"},{"hanja":"占","meaning":"점칠 / 점령할 점"},{"hanja":"點","meaning":"점 점"},{"hanja":"丁","meaning":"고무래 / 장정 정"},{"hanja":"整","meaning":"가지런할 정"},{"hanja":"靜","meaning":"고요할 정"},{"hanja":"帝","meaning":"임금 제"},{"hanja":"組","meaning":"짤 조"},{"hanja":"條","meaning":"가지 조"},{"hanja":"潮","meaning":"밀물 / 조수 조"},{"hanja":"存","meaning":"있을 존"},{"hanja":"從","meaning":"좇을 종"},{"hanja":"鍾","meaning":"쇠북 종"},{"hanja":"座","meaning":"자리 좌"},{"hanja":"朱","meaning":"붉을 주"},{"hanja":"周","meaning":"두루 주"},{"hanja":"酒","meaning":"술 주"},{"hanja":"證","meaning":"증거 증"},{"hanja":"誌","meaning":"기록할 지"},{"hanja":"智","meaning":"슬기 / 지혜 지"},{"hanja":"持","meaning":"가질 지"},{"hanja":"織","meaning":"짤 직"},{"hanja":"陣","meaning":"진칠 진"},{"hanja":"珍","meaning":"보배 진"},{"hanja":"盡","meaning":"다할 진"},{"hanja":"差","meaning":"다를 차"},{"hanja":"讚","meaning":"기릴 찬"},{"hanja":"採","meaning":"캘 채"},{"hanja":"冊","meaning":"책 책"},{"hanja":"泉","meaning":"샘 천"},{"hanja":"聽","meaning":"들을 청"},{"hanja":"廳","meaning":"관청 청"},{"hanja":"招","meaning":"부를 초"},{"hanja":"推","meaning":"밀 추"},{"hanja":"縮","meaning":"밀 퇴 / 줄일 축"},{"hanja":"趣","meaning":"뜻 취"},{"hanja":"就","meaning":"나아갈 취"},{"hanja":"層","meaning":"층 층"},{"hanja":"寢","meaning":"잘 침"},{"hanja":"針","meaning":"바늘 침"},{"hanja":"稱","meaning":"일컬을 칭"},{"hanja":"彈","meaning":"탄알 탄"},{"hanja":"歎","meaning":"탄식할 탄"},{"hanja":"脫","meaning":"벗을 탈"},{"hanja":"探","meaning":"찾을 탐"},{"hanja":"擇","meaning":"가릴 택"},{"hanja":"討","meaning":"칠 토"},{"hanja":"痛","meaning":"아플 통"},{"hanja":"投","meaning":"던질 투"},{"hanja":"鬪","meaning":"싸움 투"},{"hanja":"派","meaning":"갈래 파"},{"hanja":"判","meaning":"판단할 판"},{"hanja":"篇","meaning":"책 편"},{"hanja":"評","meaning":"평할 평"},{"hanja":"閉","meaning":"닫을 폐"},{"hanja":"胞","meaning":"세포 포"},{"hanja":"爆","meaning":"터질 폭"},{"hanja":"標","meaning":"표할 표"},{"hanja":"疲","meaning":"피곤할 피"},{"hanja":"避","meaning":"피할 피"},{"hanja":"恨","meaning":"한 한"},{"hanja":"閑","meaning":"한가할 한"},{"hanja":"抗","meaning":"겨룰 항"},{"hanja":"核","meaning":"씨 핵"},{"hanja":"憲","meaning":"법 헌"},{"hanja":"險","meaning":"험할 험"},{"hanja":"革","meaning":"가죽 혁"},{"hanja":"顯","meaning":"나타날 현"},{"hanja":"刑","meaning":"형벌 형"},{"hanja":"或","meaning":"혹 혹"},{"hanja":"婚","meaning":"혼인할 혼"},{"hanja":"混","meaning":"섞을 혼"},{"hanja":"紅","meaning":"붉을 홍"},{"hanja":"華","meaning":"빛날 화"},{"hanja":"環","meaning":"고리 환"},{"hanja":"歡","meaning":"기쁠 환"},{"hanja":"況","meaning":"상황 / 하물며 황"},{"hanja":"灰","meaning":"재 회"},{"hanja":"厚","meaning":"두터울 후"},{"hanja":"候","meaning":"기후 후"},{"hanja":"揮","meaning":"휘두를 휘"},{"hanja":"喜","meaning":"기쁠 희"}];
let quiz=[],idx=0,score=0,tries=0,wrong=[],student="";
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(n){student=$("name").value.trim()||"이름없음";quiz=shuffle(BANK).slice(0,n);idx=0;score=0;wrong=[];show("quiz");load()}
function load(){const q=quiz[idx];$("progress").textContent=(idx+1)+" / "+quiz.length;$("score").textContent="점수 "+score;$("hanja").textContent=q.hanja;$("answer").value="";$("answer").disabled=false;$("feedback").textContent="";tries=0;$("answer").focus()}
function normalize(s){return s.replace(/\s+/g,"").replace(/[·ㆍ]/g,"/")}
function check(){const q=quiz[idx],v=normalize($("answer").value),a=normalize(q.meaning);if(!v){$("feedback").textContent="훈음을 입력해 주세요.";return}if(v===a){score++;$("feedback").textContent="⭕ 정답입니다!";$("answer").disabled=true;setTimeout(next,450)}else{tries++;if(tries===1){$("feedback").textContent="❌ 다시 한 번 생각해 보세요! 한 번 더 기회가 있어요."}else{$("feedback").textContent="❌ 정답: "+q.meaning;wrong.push(q)}}}
function showAnswer(){const q=quiz[idx];$("feedback").textContent="정답: "+q.meaning}
function next(){idx++;if(idx>=quiz.length)finish();else load()}
function finish(){show("result");$("resultName").textContent=student+" 학생";$("finalScore").textContent=score+" / "+quiz.length;$("percent").textContent=Math.round(score/quiz.length*100)+"점";$("wrong").innerHTML=wrong.length?("<b>틀린 문제 "+wrong.length+"개</b>"+wrong.map(x=>"<div><b>"+x.hanja+"</b> — "+x.meaning+"</div>").join("")):"🎯 틀린 문제가 없습니다!";$("retry").style.display=wrong.length?"block":"none"}
function retryWrong(){if(!wrong.length)return;quiz=shuffle(wrong);idx=0;score=0;wrong=[];show("quiz");load()}
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
</script></body></html>
