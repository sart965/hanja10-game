function showCelebration(count,which){const title=which==="m"?"훈음 정복 도전!":"독음 퀴즈 돌파!";let line=count===50&&which==="m"?"와아! 훈음 50자 완주!":count===100&&which==="r"?"독음 100문항 완주! 정말 잘했어요!":count>=40?"대단해요! 여기까지 오다니 집중력 최고!":count>=20?"실력이 쑥쑥! 이 기세로 계속 가요!":"잘하고 있어요! 계속 도전해요!";const el=document.createElement("div");el.className="celebrate";el.innerHTML='<div class="celebrateBox"><span class="spark a">✨</span><span class="spark b">🎉</span><span class="spark c">⭐</span><span class="spark d">🎊</span><div class="celebrateEmoji">🥳 🎉 🏆</div><div class="celebrateTitle">'+count+'문항 돌파!</div><div class="celebrateText"><b>'+title+'</b><br>'+line+'<br><span style="font-size:14px">다음 목표까지 계속 도전!</span></div><button id="celebrateContinue">계속 도전하기 💪</button></div>';document.body.appendChild(el);document.getElementById("celebrateContinue").onclick=()=>{el.remove();render()};el.onclick=e=>{if(e.target===el){el.remove();render()}}}
