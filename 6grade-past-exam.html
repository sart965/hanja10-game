const HMAP=new Map(BANK.map(x=>[x.h,x.k]));for(const [h,k] of Object.entries(EXTRA))if(!HMAP.has(h))HMAP.set(h,k);
function start(){const n=$("session").value;
 if(mode==="r"){items=(EXAMS[n]||"").split(",").map(x=>x.split("=")).filter(x=>x.length===2).map(x=>[x[0].trim(),x[1].trim()]);}
 else{items=(HSET[n]||"").split(/\s+/).filter(Boolean).map(h=>[h,HMAP.get(h)||""]);}
 idx=0;score=0;tries=0;miss=[];render()}
function render(){if(idx>=items.length){finish();return}
 $("mTab").classList.toggle("on",mode==="m");$("rTab").classList.toggle("on",mode==="r");
 $("counter").textContent=(idx+1)+" / "+items.length;$("points").textContent="점수 "+score;$("bar").style.width=(idx/items.length*100)+"%";
 const q=items[idx];$("game").innerHTML='<div class="card"><div class="hanja">'+q[0]+'</div><div class="prompt">'+(mode==="m"?'이 한자의 훈(뜻)과 음을 입력하세요.':'이 한자어의 독음을 입력하세요.')+'</div></div><div class="answer"><input id="answer" autocomplete="off" placeholder="'+(mode==="m"?'예: 땅 지':'예: 공감')+'"><button class="primary" id="check">정답 확인</button></div><div id="feedback" class="hint"></div>';
 $("check").onclick=check;$("answer").onkeydown=e=>{if(e.key==="Enter")check()};$("answer").focus()}
function check(){const input=$("answer"),expected=items[idx][1];const accepted=mode==="m"?expected.split("/").map(x=>norm(x)): [norm(expected)];if(accepted.includes(norm(input.value))){score+=tries?1:2;advance();return}
 tries++;$("feedback").textContent=tries===1?"아쉬워요! 한 번 더 도전해 보세요.":"정답: "+expected;
 if(tries>=2){miss.push(items[idx]);setTimeout(advance,1000)}}
function advance(){idx++;tries=0;if(idx>0&&idx<items.length&&idx%10===0){celebrate();return}render()}
function celebrate(){const messages={10:["🎉🎊✨","멋져요! 첫 10문항 돌파!","집중력이 정말 좋아요! 잠깐 숨 고르고 다음 문제도 힘차게 가요! 💪"],20:["🎆🥳🌟","대단해요! 20문항 달성!","꾸준히 해내는 모습이 멋져요. 마지막까지 파이팅! 🚀"]};const m=messages[idx]||["🎇🏆💖","잘하고 있어요!","한 문제씩 차근차근! 여러분의 노력이 실력이 됩니다. 💖"];
 $("game").innerHTML='<div class="celebrate"><div class="celebrateBox"><div class="celebrateEmoji">'+m[0]+'</div><div class="celebrateTitle">'+m[1]+'</div><div class="celebrateText">'+m[2]+'</div><button class="primary" id="continueQuiz">계속 도전하기 ➜</button></div></div>';$("continueQuiz").onclick=render}
function finish(){$("counter").textContent=items.length+" / "+items.length;$("points").textContent="완료";$("bar").style.width="100%";const name=$("student").value.trim()||"학생";$("game").innerHTML='<div class="end"><div>🎉 '+$("session").value+'회 '+(mode==="m"?"훈음":"독음")+' 완료!</div><div class="score">'+score+'점</div><div>'+name+' · '+items.length+'문항 · 오답 '+miss.length+'개</div><p><button class="primary" id="again">다시 풀기</button> <button class="primary" id="showMiss">오답 확인</button></p><div id="miss" class="list"></div></div>';$("again").onclick=start;$("showMiss").onclick=()=>{$("miss").innerHTML=miss.length?miss.map(x=>'<div><b>'+x[0]+'</b> — '+x[1]+'</div>').join(""):"오답이 없습니다."}}
$("mTab").onclick=()=>{mode="m";start()};$("rTab").onclick=()=>{mode="r";start()};$("session").onchange=start;start();
</script></body></html>
