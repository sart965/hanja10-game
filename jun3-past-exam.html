<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어문회 준3급 기출 훈음테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#18223b;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:22px 16px 40px}h1{font-size:23px;margin:0 0 8px}.sub{color:#64748b;font-size:14px;line-height:1.6;margin-bottom:16px}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1;min-width:0}select,input,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #cbd5e1}select,input{width:100%;background:#fff}button{cursor:pointer;font-weight:800;background:#eef1f8;color:#24345d;border:0}.primary{background:#30458a;color:#fff}.pill{display:inline-block;background:#edf1ff;color:#30458a;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.stat{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin:16px 0 8px}.track{height:7px;background:#e8ebf3;border-radius:8px;overflow:hidden}.bar{height:100%;background:#6278d7;width:0}.card{border:1px solid #dbe2ef;border-radius:22px;padding:22px 16px;margin:15px 0;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}.hanja{font-size:30px;font-weight:900;margin:10px 0;line-height:1.6}.sentence{font-size:20px;font-weight:800;line-height:1.75;margin:12px 0}.small{font-size:13px;color:#64748b;line-height:1.6}.feedback{font-weight:800;margin:12px 0;line-height:1.6}.good{color:#18734b}.bad{color:#b42318}.hidden{display:none!important}.end{text-align:center;padding:26px 4px}.score{font-size:40px;font-weight:900;color:#30458a;margin:14px}.note{background:#f7f8fc;border-radius:12px;padding:12px;font-size:12px;color:#64748b;line-height:1.65;margin-top:20px}@media(max-width:480px){.wrap{padding:18px 12px}.sentence{font-size:18px}}
</style></head><body><main class="wrap">
<h1>📘 한국어문회 준3급 기출 훈음테스트</h1>
<div class="sub">실제 기출 문제를 보고 답을 입력하세요. 오답은 한 번 더 도전할 수 있고, 끝나면 틀린 문제만 다시 풀 수 있습니다.</div>
<label class="small">회차</label><div class="row"><select id="session"><option value="112">제112회 · 3급Ⅱ</option></select><select id="mode"><option value="reading">독음 테스트 (1~45번)</option><option value="hanja">훈음 테스트 (46~72번)</option></select></div>
<label class="small">학생 이름</label><div class="row"><input id="student" placeholder="이름을 입력하세요"></div>
<div class="row"><button id="start" class="primary">시험 시작</button><button id="review">틀린 문제 다시 풀기</button></div>
<div id="quiz" class="hidden"><div class="stat"><span id="count"></span><span id="score"></span></div><div class="track"><div class="bar" id="bar"></div></div>
<section class="card"><div><span class="pill" id="tag">독음</span></div><div class="small" id="number"></div><div class="sentence" id="question"></div><div class="small" id="hint"></div></section>
<div class="row"><input id="answer" autocomplete="off" placeholder="정답을 입력하세요"><button id="submit" class="primary">정답 확인</button></div><div id="feedback" class="feedback"></div><div class="row"><button id="retry" class="hidden">한 번 더 도전</button><button id="next" class="primary hidden">다음 문제 →</button></div></div>
<div id="done" class="end hidden"><div class="pill">시험 종료</div><div class="score" id="finalScore"></div><div id="summary"></div><div class="row"><button id="wrongOnly" class="primary">틀린 문제만 다시 풀기</button><button id="restart">처음부터 다시</button></div></div>
<div class="note">자료 기준: 업로드된 「한국어문회 준3급 독음 기출문제모음(101~112회)」 및 「101~112회 정답지」. 현재는 112회 문항을 먼저 등록한 1차 버전입니다. 나머지 회차도 같은 방식으로 추가할 예정이며, 판독이 불명확한 OCR 문자는 임의로 추정해 넣지 않았습니다.</div>
</main>
<script>
const reading=[
["도시에 각종 범죄가 橫行했다.","횡행"],["설악산의 奇巖은 감탄을 자아낸다.","기암"],["공장이 폭격에 의해 破壞당했다.","파괴"],["그는 무슨 患亂이 닥칠지 몰라 두려움에 떨었다.","환란"],["사람의 직업만 보고 賤待해서는 안 된다.","천대"],["회사는 과잉 투자로 倒産했다.","도산"],["소련군이 점차 壓迫해 오자 독일은 본국으로 후퇴했다.","압박"],["그의 오해 때문에 착한 아내가 疏薄당했다.","소박"],["그들은 위험한 사상에 感染이 되었다.","감염"],["아군이 적군에게 逆襲을 당했다.","역습"],["선거에서 참패해서 당 자체가 消滅했다.","소멸"],["그의 육신은 이제 하루가 다르게 衰殘해졌다.","쇠잔"],["밤이 되자 군인들은 부대 주위를 森嚴히 경계하기 시작했다.","삼엄"],["인간은 버림받을 때에 孤愁를 맛보기 마련이다.","고수"],["강도는 행인의 가방을 强奪했다.","강탈"],["선생님의 遺稿를 모아 출판했다.","유고"],["더운 날씨에 溪流에 발을 담그니 시원했다.","계류"],["산속 깊이 숨겨져 있는 오래된 절의 고색이 蒼然하다.","창연"],["실업자 문제가 최근의 주요 懸案으로 떠오르고 있다.","현안"],["업무를 정리하기에는 남은 시간이 너무 促急했다.","촉급"],["陶醉","도취"],["離懷","이회"],["顯揚","현양"],["恩功","은공"],["洗腦","세뇌"],["靈境","영경"],["短項","단항"],["熱裂","열렬"],["萬騎","만기"],["延滯","연체"],["完封","완봉"],["奮發","분발"],["累計","누계"],["暗默","암묵"],["貫徹","관철"],["干拓","간척"],["憂慮","우려"],["許諾","허락"],["漆板","칠판"],["能力","능률"],["露宿","노숙"],["印刷","인쇄"],["弄舌","농설"],["血糖","혈당"],["踏査","답사"]
];
const hanja=[
["證","증거 증"],["慕","그릴 모"],["殊","다를 수"],["拘","잡을 구"],["菌","버섯 균"],["避","피할 피"],["吐","토할 토"],["鉛","납 연"],["磨","갈 마"],["忽","갑자기 홀"],["珠","구슬 주"],["吏","벼슬아치/관리 리"],["貢","바칠 공"],["含","머금을 함"],["昌","창성할 창"],["悟","깨달을 오"],["聯","연이을 련"],["虎","범 호"],["勿","말 물"],["綿","솜 면"],["兼","겸할 겸"],["翼","날개 익"],["尺","자 척"],["賴","의뢰할 뢰"],["納","들일 납"],["桂","계수나무 계"],["尚","오히려 상"]
];
const $=id=>document.getElementById(id);let active=[],i=0,correct=0,wrong=[],retrying=false,firstTry=true,wrongSet=[],answered=false;
function norm(s){return s.trim().replace(/[\s·ㆍ,，.。]/g,"").replace(/[漢汉]/g,"")}
function bank(){return $("mode").value==="reading"?reading:hanja}
function start(items=null,isRetry=false){active=(items||bank().map((q,n)=>({q,n}))).map(x=>x.q?x:{q:bank()[x.n],n:x.n});i=0;correct=0;wrong=[];retrying=isRetry;firstTry=true;$("done").classList.add("hidden");$("quiz").classList.remove("hidden");draw()}
function draw(){if(i>=active.length){finish();return}answered=false;firstTry=true;const item=active[i].q;const isRead=$("mode").value==="reading";$("count").textContent=(i+1)+" / "+active.length;$("score").textContent="정답 "+correct;$("bar").style.width=(i/active.length*100)+"%";$("tag").textContent=isRead?"독음":"훈음";$("number").textContent="문제 "+(active[i].n+1);$("question").textContent=isRead?item[0]:item[0];$("hint").textContent=isRead?"밑줄 친 한자어의 독음을 입력하세요.":"한자의 훈과 음을 함께 입력하세요."; $("answer").value="";$("answer").disabled=false;$("submit").classList.remove("hidden");$("submit").disabled=false;$("feedback").textContent="";$("retry").classList.add("hidden");$("next").classList.add("hidden");$("answer").focus()}
function check(){if(answered)return;const item=active[i].q, expected=item[1];const val=$("answer").value;if(!val.trim()){$("feedback").textContent="정답을 입력해 주세요.";return}if(norm(val)===norm(expected)){answered=true;correct++;$("feedback").textContent="정답입니다!";$("feedback").className="feedback good";$("answer").disabled=true;$("submit").classList.add("hidden");$("next").classList.remove("hidden");$("score").textContent="정답 "+correct;return}
if(firstTry){firstTry=false;$("feedback").textContent="아쉬워요! 한 번 더 입력해 보세요."; $("feedback").className="feedback bad";$("retry").classList.remove("hidden");$("submit").classList.add("hidden");return}
answered=true;wrong.push(active[i]);$("feedback").textContent="정답: "+expected;$("feedback").className="feedback bad";$("answer").disabled=true;$("submit").classList.add("hidden");$("retry").classList.add("hidden");$("next").classList.remove("hidden")}
$("submit").onclick=check;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});$("retry").onclick=()=>{$("retry").classList.add("hidden");$("submit").classList.remove("hidden");$("answer").focus()};$("next").onclick=()=>{i++;draw()};
function finish(){wrongSet=wrong.slice();$("quiz").classList.add("hidden");$("done").classList.remove("hidden");$("bar").style.width="100%";$("finalScore").textContent=correct+" / "+active.length;$("summary").textContent="틀린 문제 "+wrong.length+"개"+(wrong.length?" · 틀린 문제만 다시 풀 수 있습니다.":" · 모두 맞혔습니다!");$("wrongOnly").disabled=wrong.length===0;$("wrongOnly").style.opacity=wrong.length===0?".5":"1"}
$("start").onclick=()=>{if(!$("student").value.trim()){alert("학생 이름을 입력해 주세요.");$("student").focus();return}start()};$("review").onclick=()=>{if(wrongSet.length){start(wrongSet,true)}else alert("먼저 시험을 끝내면 틀린 문제를 다시 풀 수 있습니다.")};$("wrongOnly").onclick=()=>{if(!wrong.length)return;const w=wrong.slice();start(w,true)};$("restart").onclick=()=>start();$("mode").onchange=()=>{wrongSet=[];$("quiz").classList.add("hidden");$("done").classList.add("hidden")};
</script></body></html>
