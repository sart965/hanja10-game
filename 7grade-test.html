<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5869ff">
<title>7급시험 훈음테스트</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#edf7ff,#fff3f7);font-family:Arial,"Noto Sans KR",sans-serif;color:#222}
.wrap{max-width:640px;margin:auto;padding:16px}
.card{background:#fff;border-radius:28px;padding:22px;margin:12px 0;box-shadow:0 10px 35px #0001}
h1{text-align:center;font-size:25px;margin:5px 0 10px}
.sub{text-align:center;color:#777;font-size:14px;line-height:1.55}
.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#eef0ff;font-size:13px;font-weight:700}
.hanja{font-family:"Noto Serif CJK KR","Batang",serif;font-size:105px;text-align:center;font-weight:900;margin:25px 0 12px}
input{width:100%;padding:16px;border:2px solid #ddd;border-radius:16px;font-size:20px;text-align:center}
input:focus{outline:0;border-color:#6374ff}
button{border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.primary{width:100%;background:#5869ff;color:white;margin-top:12px}
.ghost{background:#f1f2f6}
.row{display:flex;gap:9px}.row>*{flex:1}
.hidden{display:none}
#feedback{min-height:32px;text-align:center;font-size:20px;font-weight:900;margin-top:12px}
.answer{text-align:center;font-size:21px;font-weight:800;color:#4658bb;min-height:30px}
.score{text-align:center;font-size:42px;font-weight:900}
li{margin:7px 0}
.wrong{background:#fff5f5;border-radius:14px;padding:10px 12px;margin:7px 0}
@media(max-width:480px){.hanja{font-size:88px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="start">
<h1>📝 7급시험 훈음테스트</h1>
<p class="sub">준7급 + 7급 배정한자 기준 · 총 100자<br>한자를 보고 <b>훈음(뜻과 음)</b>을 맞혀 보세요!</p>
<br>
<input id="name" placeholder="학생 이름 (선택)">
<br><br>
<div class="row">
<button class="ghost" onclick="begin(10)">10문제</button>
<button class="ghost" onclick="begin(20)">20문제</button>
<button class="ghost" onclick="begin(50)">50문제</button>
</div>
<button class="primary" onclick="begin(100)">🚀 100자 전체 연습</button>
<p class="sub">문제는 무작위로 출제됩니다.</p>
</div>

<div class="card hidden" id="quiz">
<div style="display:flex;justify-content:space-between"><span class="badge" id="grade">7급</span><b id="count"></b></div>
<div class="hanja" id="h"></div>
<div class="sub">이 한자의 <b>훈음</b>을 입력하세요<br>예: 집 가</div><br>
<input id="answerInput" placeholder="뜻 + 음을 입력하세요" autocomplete="off">
<button class="primary" onclick="check()">정답 확인</button>
<div id="feedback"></div>
<div class="answer" id="correct"></div>
<div class="row" style="margin-top:12px">
<button class="ghost" onclick="reveal()">정답 보기</button>
<button class="ghost" onclick="next()">다음 ▶</button>
</div>
</div>

<div class="card hidden" id="result">
<h1>🎉 연습 끝!</h1>
<div class="score" id="score"></div>
<div id="summary"></div>
<button class="primary" onclick="location.reload()">다시 연습</button>
</div>
</div>

<script>
const bank=[
["歌","노래 가"],["家","집 가"],["間","사이 간"],["江","강 강"],["車","수레 차 / 거"],["工","장인 공"],["空","빌 공"],["口","입 구"],["記","기록할 기"],["氣","기운 기"],
["旗","기 기 / 깃발 기"],["男","사내 남"],["內","안 내"],["農","농사 농"],["答","대답 답"],["道","길 도"],["冬","겨울 동"],["同","공동 동 / 한 가지 동"],["洞","골 동"],["動","움직일 동"],
["登","오를 등"],["來","올 래 / 내"],["力","힘 력 / 역"],["老","늙을 로 / 노"],["里","마을 리 / 이"],["林","수풀 림 / 임"],["立","설 립 / 입"],["每","매양 매"],["面","낯 면"],["名","이름 명"],
["命","목숨 명"],["文","글월 문"],["問","물을 문"],["物","만물 물 / 물건 물"],["方","모 방"],["百","일백 백"],["夫","지아비 부"],["不","아닐 부 / 불"],["事","일 사"],["算","셈할 산"],
["上","윗 상"],["色","빛 색"],["夕","저녁 석"],["姓","성 성"],["世","인간 세"],["少","젊을 소"],["所","바 소 / 곳 소"],["手","손 수"],["數","셀 수"],["市","저자 시"],
["時","때 시"],["食","밥 식"],["植","심을 식"],["心","마음 심"],["安","편안할 안"],["語","말씀 어"],["然","그러할 연"],["午","낮 오"],["右","오른쪽 우"],["有","있을 유"],
["育","기를 육"],["邑","고을 읍"],["入","들 입"],["子","아들 자"],["字","글자 자"],["自","스스로 자"],["場","마당 장"],["全","온전 전"],["前","앞 전"],["電","번개 전"],
["正","바를 정"],["祖","조상 조 / 할아비 조"],["足","발 족"],["左","왼 좌"],["主","주인 주"],["住","기댈 주 / 살 주"],["重","무거울 중 / 중력 중"],["地","땅 지"],["紙","종이 지"],["直","곧을 직"],
["千","일천 천"],["川","내 천"],["天","하늘 천"],["草","풀 초"],["村","마을 촌"],["秋","가을 추"],["春","봄 춘"],["出","날 출"],["便","편안할 편 / 똥오줌 변"],["平","평평할 평"],
["下","아래 하"],["夏","여름 하"],["漢","한나라 한"],["海","바다 해"],["花","꽃 화"],["話","말씀 화 / 말할 화"],["活","살 활"],["孝","효도 효"],["後","뒤 후"],["休","쉴 휴"]
];

let quiz=[],idx=0,score=0,checked=false,wrong=[],attempts=0;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function norm(s){
 return (s||"").replace(/[\s·ㆍ,，.。/／]+/g,"").toLowerCase();
}
function begin(n){
 const name=document.getElementById("name").value.trim();
 if(n>bank.length)n=bank.length;
 quiz=shuffle(bank.map(x=>({h:x[0],a:x[1]})).slice()).slice(0,n);
 idx=0;score=0;checked=false;wrong=[];attempts=0;
 document.getElementById("start").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("grade").textContent="7급 · "+n+"문제";
 show();
}
function show(){
 checked=false;
 attempts=0;
 document.getElementById("count").textContent=(idx+1)+" / "+quiz.length;
 document.getElementById("h").textContent=quiz[idx].h;
 document.getElementById("answerInput").value="";
 document.getElementById("answerInput").disabled=false;
 document.getElementById("feedback").textContent="";
 document.getElementById("correct").textContent="";
 setTimeout(()=>document.getElementById("answerInput").focus(),50);
}
function check(){
 if(checked)return;
 const q=quiz[idx], user=norm(document.getElementById("answerInput").value), ans=norm(q.a);
 if(!user)return;
 const ok=user===ans || (user.length>=2 && ans.includes(user));
 if(ok){
   checked=true;
   score++;
   document.getElementById("feedback").textContent="⭕ 정답입니다!";
   document.getElementById("correct").textContent="";
   document.getElementById("answerInput").disabled=true;
 }else{
   attempts++;
   if(attempts===1){
     document.getElementById("feedback").textContent="❌ 아쉬워요! 한 번 더 생각해 보세요.";
     document.getElementById("correct").textContent="";
     document.getElementById("answerInput").value="";
     document.getElementById("answerInput").focus();
   }else{
     checked=true;
     wrong.push(q);
     document.getElementById("feedback").textContent="❌ 두 번 도전했어요. 다음 문제에서 다시 만나요!";
     document.getElementById("correct").textContent="정답: "+q.a;
     document.getElementById("answerInput").disabled=true;
   }
 }
}
function reveal(){
 if(attempts<1 || checked)return;
 const q=quiz[idx];
 document.getElementById("correct").textContent="정답: "+q.a;
}
function next(){
 if(idx<quiz.length-1){idx++;show();}
 else finish();
}
function finish(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 const pct=Math.round(score/quiz.length*100);
 document.getElementById("score").textContent=score+" / "+quiz.length+"점";
 let html="<p style='text-align:center;font-weight:800'>정답률 "+pct+"%</p>";
 if(wrong.length){
   html+="<h3>📌 다시 공부할 한자</h3><ul>";
   wrong.forEach(q=>{html+="<li class='wrong'><b>"+q.h+"</b> → "+q.a+"</li>"});
   html+="</ul>";
 }else html+="<p style='text-align:center'>🎊 모두 정답이에요!</p>";
 document.getElementById("summary").innerHTML=html;
}
document.getElementById("answerInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")check();
});
</script>
</body>
</html>
