0)">200문제</button><button class="primary" style="margin-top:0" onclick="begin(250)">🚀 250문제</button></div><p class="sub">문제는 무작위로 출제됩니다.</p></div><div class="card hidden" id="quiz"><div style="display:flex;justify-content:space-between"><span class="badge" id="grade">준4급</span><b id="count"></b></div><div class="hanja" id="h"></div><div class="sub">이 한자의 <b>훈음</b>을 입력하세요<br>예: 거리 가</div><br><input id="answerInput" placeholder="뜻 + 음을 입력하세요" autocomplete="off"><button class="primary" onclick="check()">정답 확인</button><div id="feedback"></div><div class="answer" id="correct"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="reveal()">정답 보기</button><button class="ghost" onclick="next()">다음 ▶</button></div></div><div class="card hidden" id="result"><h1>🎉 연습 끝!</h1><div class="score" id="score"></div><div id="summary"></div><button class="primary" id="retryBtn" onclick="retryWrong()">🔄 틀린 문제 다시 풀기</button></div></div><script>

let deck=[],idx=0,total=0,score=0,done=false,attempts=0,wrong=[];
const $=x=>document.getElementById(x);
function norm(s){return(s||'').replace(/[\s·ㆍ,，.。/／]+/g,'').toLowerCase()}
function begin(n){deck=[...BANK].sort(()=>Math.random()-0.5).slice(0,n);idx=0;total=n;score=0;wrong=[];$('start').classList.add('hidden');$('quiz').classList.remove('hidden');load()}
function load(){done=false;attempts=0;$('count').textContent=(idx+1)+' / '+total;$('h').textContent=deck[idx][0];$('answerInput').value='';$('answerInput').disabled=false;$('feedback').textContent='';$('correct').textContent='';$('answerInput').focus()}
function check(){if(done)return;let q=deck[idx],u=norm($('answerInput').value),a=norm(q[1]);if(!u)return;if(u===a||(u.length>=2&&a.includes(u))){done=true;score++;$('feedback').textContent='⭕ 정답입니다!';$('answerInput').disabled=true}else{attempts++;if(attempts===1){$('feedback').textContent='❌ 다시 한 번 도전해 보세요!';$('answerInput').value='';$('answerInput').focus()}else{done=true;wrong.push(q);$('feedback').textContent='❌ 두 번 틀렸어요.';$('correct').textContent='정답: '+q[1];$('answerInput').disabled=true}}}
function reveal(){if(done)return;done=true;$('correct').textContent='정답: '+deck[idx][1];$('answerInput').disabled=true}
function next(){if(!done)return;if(idx<total-1){idx++;load()}else finish()}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+' / '+total+'점';let s='<p style="text-align:center">정답률 '+Math.round(score/total*100)+'%</p>';if(wrong.length){s+='<h3>📌 틀린 문제</h3><ul>'+wrong.map(q=>'<li class="wrong"><b>'+q[0]+'</b> — '+q[1]+'</li>').join('')+'</ul>'}else s+='<p style="text-align:center">✨ 모두 맞혔어요!</p>';$('summary').innerHTML=s;$('retryBtn').textContent=wrong.length?'🔄 틀린 '+wrong.length+'문제 다시 풀기':'🔄 다시 연습하기'}
function retryWrong(){if(!wrong.length){location.reload();return}deck=[...wrong].sort(()=>Math.random()-0.5);total=deck.length;idx=0;score=0;wrong=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');load()}
