function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mixedReadingDeck(){const buckets={2:[],3:[],4:[],other:[]};shuffle([...R]).forEach(q=>{const n=Array.from(q.h).length; (buckets[n]||buckets.other).push(q)});Object.keys(buckets).forEach(k=>shuffle(buckets[k]));const out=[];while(Object.values(buckets).some(a=>a.length)){const keys=shuffle(["2","3","4","other"].filter(k=>buckets[k].length));for(const k of keys){if(buckets[k].length)out.push(buckets[k].pop())}}return out}
function start(){if(!$("studentName").value.trim()){$("nameMsg").textContent="학생 이름을 입력해 주세요.";return}saveName();deck=mode==="m"?shuffle([...BANK]).slice(0,1000):mixedReadingDeck().slice(0,300);idx=0;score=0;attempt=0;wrong=[];locked=false;$("start").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");load()}
$("startBtn").onclick=start;
function load(){attempt=0;locked=false;$("msg").textContent="";$("ans").value="";$("ans").disabled=false;$("check").disabled=false;$("pg").textContent=(idx+1).toLocaleString()+" / "+deck.length.toLocaleString()+"문항";$("sc").textContent="점수 "+score;$("bar").style.width=(idx/deck.length*100)+"%";$("event").innerHTML="";if(mode==="m"&&(idx+1)%20===0){$("event").innerHTML='<div class="event">⚡ 폭주 이벤트! 집중력 발동! 다음 문제까지 힘내세요! ⚡</div>'}const q=deck[idx];$("question").innerHTML='<div class="q"><div class="hanja">'+q.h+'</div>'+(mode==="r"&&q.meaning?'<div class="clue" style="font-size:18px;color:#30458a;font-weight:bold;margin-top:16px">뜻풀이: '+q.meaning+'</div>':'')+'<div class="clue">'+(mode==="m"?"훈(뜻)과 음을 함께 입력하세요.":"위 한자어의 독음을 한글로 입력하세요.")+'</div></div>';$("ans").placeholder=mode==="m"?"예: 아름다울 가":"예: 격세지감";$("ans").focus()}
function check(){if(locked)return false;const q=deck[idx],expected=q.k;if(accepted($("ans").value,expected)){score+=attempt===0?2:1;locked=true;$("msg").textContent=attempt===0?"⭕ 정답입니다! +2점":"⭕ 재도전 정답! +1점";$("ans").disabled=true;$("check").disabled=true;return true}attempt++;if(attempt===1){$("msg").textContent="❌ 다시 한 번 도전해 보세요!";$("ans").value="";$("ans").focus();return false}else{locked=true;wrong.push({q:q.h,a:expected});$("msg").textContent="❌ 두 번 틀렸어요. 정답: "+expected;$("ans").disabled=true;$("check").disabled=true;return false}}
$("check").onclick=check;$("ans").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(locked){next()}else if(check()===true){setTimeout(next,250)}}};
function next(){if(!locked){$("msg").textContent="먼저 정답을 확인해 주세요.";return}idx++;if(idx>=deck.length){finish();return}load()}
$("next").onclick=next;
function finish(){$("game").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+"점";$("resultLine").textContent=($("studentName").value.trim()||"학생")+" · "+(mode==="m"?"훈음":"독음")+" · "+deck.length+"문항";$("wrongCount").textContent="두 번 틀린 문제: "+wrong.length+"개";$("bar").style.width="100%";$("review").classList.add("hidden")}
$("quit").onclick=()=>{if(confirm("현재 테스트를 종료할까요?"))finish()};
$("again").onclick=start;$("home").onclick=()=>setMode(mode);$("reviewBtn").onclick=()=>{const box=$("review");box.innerHTML=wrong.length?wrong.map(x=>"<p><b>"+x.q+"</b> — "+x.a+"</p>").join(""):"틀린 문제가 없습니다. 잘했어요!";box.classList.toggle("hidden")};
$("studentName").value=localStorage.getItem("jun3StudentName")||"";if($("studentName").value)$("nameMsg").textContent="저장된 이름: "+$("studentName").value;drawCounts();
</script></body></html>
